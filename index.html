<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡La Divertida Tabla de Multiplicar!</title>
    <!-- Importamos una tipografía divertida y amigable desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="multiplicar.css">
</head>
<body>

    <header class="header">
        <div class="controls-container">
            <!-- Instrucción y ayuda en la caja de texto -->
            <div class="input-group">
                <label for="numeroTabla" class="label-instruccion">💡 Ingresa un número:</label>
                <input type="number" id="numeroTabla" class="input-numero" placeholder="Ej. 5" min="1" max="100">
            </div>
            <button class="btn-probar" onclick="generarTablas()">¡PROBAR!</button>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h1>🎈 Tabla de Multiplicar 🎈</h1>
            <!-- Mensaje de ayuda intuitivo -->
            <p class="help-text">¡Escribe el número que quieras aprender y presiona el botón!</p>
            <div class="tabla" id="tablaMultiplicar">
                <div class="fila">5 × 1 = <span>5</span></div>
                <div class="fila">5 × 2 = <span>10</span></div>
                <div class="fila">5 × 3 = <span>15</span></div>
                <div class="fila">5 × 4 = <span>20</span></div>
                <div class="fila">5 × 5 = <span>25</span></div>
                <div class="fila">5 × 6 = <span>30</span></div>
                <div class="fila">5 × 7 = <span>35</span></div>
                <div class="fila">5 × 8 = <span>40</span></div>
                <div class="fila">5 × 9 = <span>45</span></div>
                <div class="fila">5 × 10 = <span>50</span></div>
                <div class="fila">5 × 11 = <span>55</span></div>
                <div class="fila">5 × 12 = <span>60</span></div>
                <div class="fila">5 × 13 = <span>65</span></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Creado con ❤️ por: Tu cariñito por siempre</p>
        <div class="logo-container">
            <img src="logo.png" alt="Logo de creador" class="logo-img">
        </div>
    </footer>

<script src="multiplicar.js"></script>
</body>
</html>
